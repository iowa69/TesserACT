<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">TesserACT</title>
  <desc id="d">A tesseract: an inner cube joined to an outer cube by four edges, drawn as a wireframe.</desc>

  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0E6E66"/>
      <stop offset="0.55" stop-color="#1FA192"/>
      <stop offset="1"   stop-color="#56D0C2"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A9541C"/>
      <stop offset="1" stop-color="#E0A052"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0"   stop-color="#0E6E66" stop-opacity="0.16"/>
      <stop offset="1"   stop-color="#0E6E66" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#0B1310"/>
  <circle cx="256" cy="240" r="220" fill="url(#glow)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the four edges joining inner cube to outer cube: the fourth dimension -->
    <g stroke="url(#edge)" stroke-width="7" opacity="0.55">
      <path d="M108 148 L188 196"/>
      <path d="M404 148 L324 196"/>
      <path d="M108 364 L188 316"/>
      <path d="M404 364 L324 316"/>
      <path d="M148 108 L204 160"/>
      <path d="M364 108 L308 160"/>
      <path d="M148 404 L204 352"/>
      <path d="M364 404 L308 352"/>
    </g>

    <!-- outer cube -->
    <g stroke="url(#edge)" stroke-width="11">
      <path d="M148 108 L364 108 L404 148 L404 364 L364 404 L148 404 L108 364 L108 148 Z"/>
      <path d="M148 108 L188 148 L188 364 L148 404"/>
      <path d="M188 148 L404 148"/>
      <path d="M188 364 L404 364"/>
    </g>

    <!-- inner cube -->
    <g stroke="url(#inner)" stroke-width="9">
      <path d="M204 160 L308 160 L324 196 L324 316 L308 352 L204 352 L188 316 L188 196 Z" opacity="0.95"/>
      <path d="M204 160 L220 196 L220 316 L204 352" opacity="0.95"/>
      <path d="M220 196 L324 196" opacity="0.95"/>
      <path d="M220 316 L324 316" opacity="0.95"/>
    </g>
  </g>

  <!-- vertices -->
  <g fill="#56D0C2">
    <circle cx="148" cy="108" r="9"/><circle cx="364" cy="108" r="9"/>
    <circle cx="404" cy="148" r="9"/><circle cx="404" cy="364" r="9"/>
    <circle cx="364" cy="404" r="9"/><circle cx="148" cy="404" r="9"/>
    <circle cx="108" cy="364" r="9"/><circle cx="108" cy="148" r="9"/>
  </g>
  <g fill="#E0A052">
    <circle cx="204" cy="160" r="7"/><circle cx="308" cy="160" r="7"/>
    <circle cx="324" cy="196" r="7"/><circle cx="324" cy="316" r="7"/>
    <circle cx="308" cy="352" r="7"/><circle cx="204" cy="352" r="7"/>
    <circle cx="188" cy="316" r="7"/><circle cx="188" cy="196" r="7"/>
  </g>
</svg>
